services:
  tor-middle-relay:
    image: r600/tor-middle-relay:latest
    container_name: tor-middle-relay
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9001:9001"
    volumes:
      - tor-data:/var/lib/tor
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /etc/tor
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tor-data:
