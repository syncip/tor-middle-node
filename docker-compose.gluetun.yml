# Middle relay routed through a gluetun VPN container.
#
# The gluetun container owns the network stack; the relay joins it via
# network_mode: "service:gluetun". That means the relay has no network
# of its own and no "ports:" section - the ORPort must be published on
# the gluetun service instead.
#
# Your VPN provider must support port forwarding and you must forward
# the ORPort, otherwise the relay will not be reachable from the Tor
# network. See README.md.
#
# Usage:
#   cp .env.example .env
#   cp .env.gluetun.example .env.gluetun
#   docker compose -f docker-compose.gluetun.yml up -d

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: tor-relay-gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env.gluetun
    ports:
      # Published here, not on the tor service, because the relay shares
      # this container's network namespace.
      - "9001:9001"
      # Dashboard of the relay, localhost only (see docker-compose.yml)
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    # No healthcheck override: gluetun ships its own HEALTHCHECK, which
    # checks the tunnel without calling a third-party IP lookup service.

  tor-middle-relay:
    image: r600/tor-middle-relay:latest
    container_name: tor-middle-relay
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - tor-data:/var/lib/tor
      - dashboard-data:/var/lib/tor-dashboard
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /etc/tor
      - /run/tor
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tor-data:
  dashboard-data:
