name: Build and Publish Docker Image

on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    # Weekly rebuild (Mondays 04:17 UTC) so the image picks up new Tor
    # releases and Debian security updates without needing a commit.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Build without cache (forces a fresh apt install)"
        type: boolean
        default: false

env:
  DOCKERHUB_IMAGE: r600/tor-middle-relay

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Skip for pull requests so forks can't access the secrets
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scheduled runs bypass the cache entirely, otherwise the cached
          # "apt-get install tor" layer would be reused and the rebuild
          # would ship the exact same (old) Tor version.
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
