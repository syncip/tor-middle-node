name: Build and Publish Docker Image

on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    # Weekly rebuild (Mondays 04:17 UTC) so the image picks up new Tor
    # releases and Debian security updates without needing a commit.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Build without cache (forces a fresh apt install)"
        type: boolean
        default: false

env:
  DOCKERHUB_IMAGE: r600/tor-middle-relay

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        # Skip for pull requests so forks can't access the secrets
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Build a local amd64 image first and prove that it can never come up
      # as an exit relay, before anything is pushed.
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tor-middle-relay:test
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}
          cache-from: type=gha

      - name: Smoke test (config safety)
        run: |
          set -eu
          run() {
            docker run --rm --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
              --security-opt no-new-privileges:true --read-only \
              --tmpfs /tmp --tmpfs /etc/tor --tmpfs /run/tor "$@"
          }
          # Build-only tools must not ship in the image
          docker run --rm --entrypoint sh tor-middle-relay:test -c \
            'for t in curl gpg wget; do if command -v "$t"; then echo "$t found in image"; exit 1; fi; done'
          docker run --rm --entrypoint cat tor-middle-relay:test /etc/tor-version
          # The default config must pass the built-in safety check
          run -e NICKNAME=CiTest tor-middle-relay:test check
          # Attempts to smuggle extra torrc lines in must be rejected
          if run -e NICKNAME=CiTest -e CONTACT_INFO="$(printf 'x\nExitPolicy accept *:*')" tor-middle-relay:test check; then
            echo "newline injection was not rejected"; exit 1
          fi
          if run -e NICKNAME='bad name' tor-middle-relay:test check; then
            echo "invalid nickname was not rejected"; exit 1
          fi
          # Start for real and wait for the relay + dashboard to come up
          docker run -d --name relay --restart unless-stopped \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true --read-only \
            --tmpfs /tmp --tmpfs /etc/tor --tmpfs /run/tor \
            -v ci-dashboard:/var/lib/tor-dashboard \
            -e NICKNAME=CiTest -e DASHBOARD_PASSWORD=ci-password \
            -p 127.0.0.1:8080:8080 tor-middle-relay:test
          api() { curl -fsS -u admin:ci-password "http://127.0.0.1:8080$1"; }
          # Wait until Tor answers with the expected nickname and a fresh start
          wait_for() {
            for i in $(seq 1 60); do
              if api /api/status 2>/dev/null | python3 -c 'import json,sys; s=json.load(sys.stdin); sys.exit(not (s["connected"] and s["settings"]["Nickname"]==sys.argv[1] and s["tor"]["uptime"] < 60))' "$1"; then
                return 0
              fi
              sleep 2
            done
            docker logs relay; echo "relay did not come up as $1"; exit 1
          }
          check_safe() {
            api /api/status | python3 -c 'import json,sys; s=json.load(sys.stdin); c=s["settings"]; assert s["connected"] and s["safety"]["ok"]; assert c["ExitRelay"]=="0" and c["ExitPolicy"]=="reject *:*" and c["IPv6Exit"]=="0" and c["BridgeRelay"]=="0", c; print("exit disabled:", c["Nickname"])'
          }
          wait_for CiTest
          check_safe

          # Setup page: writes need the CSRF token, unknown keys are refused
          token="$(api /api/settings | python3 -c 'import json,sys; print(json.load(sys.stdin)["csrf"])')"
          post() { curl -sS -o /dev/null -w '%{http_code}' -u admin:ci-password -X POST \
                     -H 'Content-Type: application/json' -H "X-CSRF-Token: $2" -d "$3" "http://127.0.0.1:8080$1"; }
          test "$(post /api/settings wrong '{"values":{}}')" = 403
          test "$(post /api/settings "${token}" '{"values":{"EXIT_RELAY":"1"}}')" = 400
          test "$(post /api/settings "${token}" '{"values":{"CONTACT_INFO":"x\nExitRelay 1"}}')" = 400
          # Change the nickname and restart Tor through the dashboard
          test "$(post /api/settings "${token}" '{"values":{"NICKNAME":"CiChanged"},"restart":true}')" = 200
          wait_for CiChanged
          check_safe

          # A tampered settings file must never get past the entrypoint
          docker exec -u tordash relay python3 -c 'import json; json.dump({"values": {"NICKNAME": "Tampered", "CONTACT_INFO": "x\nExitPolicy accept *:*", "ExitRelay": "1"}}, open("/var/lib/tor-dashboard/settings.json", "w"))'
          docker restart relay
          wait_for CiTest
          check_safe
          docker logs relay 2>&1 | grep -q "settings from the setup page were NOT applied"
          docker logs relay | tail -40
          docker rm -f relay

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scheduled runs bypass the cache entirely, otherwise the cached
          # "apt-get install tor" layer would be reused and the rebuild
          # would ship the exact same (old) Tor version.
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        # Pushing an image does not update the Docker Hub README - that's a
        # separate API call. Needs a token with read/write/DELETE scope; a
        # plain push token returns 403, so this must not fail the build.
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "Minimal, hardened Tor middle relay - no exit, no bridge"
          readme-filepath: ./README.md
          enable-url-completion: true
