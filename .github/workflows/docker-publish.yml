name: Build and Publish Docker Image

on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    # Weekly rebuild (Mondays 04:17 UTC) so the image picks up new Tor
    # releases and Debian security updates without needing a commit.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Build without cache (forces a fresh apt install)"
        type: boolean
        default: false

env:
  DOCKERHUB_IMAGE: r600/tor-middle-relay

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Skip for pull requests so forks can't access the secrets
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Build a local amd64 image first and prove that it can never come up
      # as an exit relay, before anything is pushed.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tor-middle-relay:test
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}
          cache-from: type=gha

      - name: Smoke test (config safety)
        run: |
          set -eu
          run() {
            docker run --rm --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
              --security-opt no-new-privileges:true --read-only \
              --tmpfs /tmp --tmpfs /etc/tor --tmpfs /run/tor "$@"
          }
          # The default config must pass the built-in safety check
          run -e NICKNAME=CiTest tor-middle-relay:test check
          # Attempts to smuggle extra torrc lines in must be rejected
          if run -e NICKNAME=CiTest -e CONTACT_INFO="$(printf 'x\nExitPolicy accept *:*')" tor-middle-relay:test check; then
            echo "newline injection was not rejected"; exit 1
          fi
          if run -e NICKNAME='bad name' tor-middle-relay:test check; then
            echo "invalid nickname was not rejected"; exit 1
          fi
          # Start for real and wait for the relay + dashboard to come up
          docker run -d --name relay --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true --read-only \
            --tmpfs /tmp --tmpfs /etc/tor --tmpfs /run/tor \
            -e NICKNAME=CiTest -p 127.0.0.1:8080:8080 tor-middle-relay:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/status | grep -q '"connected": true'; then break; fi
            sleep 2
          done
          docker logs relay
          status="$(curl -fsS http://127.0.0.1:8080/api/status)"
          echo "${status}" | python3 -c 'import json,sys; s=json.load(sys.stdin); c=s["settings"]; assert s["connected"] and s["safety"]["ok"]; assert c["ExitRelay"]=="0" and c["ExitPolicy"]=="reject *:*" and c["IPv6Exit"]=="0" and c["BridgeRelay"]=="0", c; print("dashboard OK, exit disabled")'
          docker rm -f relay

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scheduled runs bypass the cache entirely, otherwise the cached
          # "apt-get install tor" layer would be reused and the rebuild
          # would ship the exact same (old) Tor version.
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        # Pushing an image does not update the Docker Hub README - that's a
        # separate API call. Needs a token with read/write/DELETE scope; a
        # plain push token returns 403, so this must not fail the build.
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "Minimal, hardened Tor middle relay - no exit, no bridge"
          readme-filepath: ./README.md
          enable-url-completion: true
